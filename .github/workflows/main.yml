name: Build Debug APK - Dharma AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── ১. রিপো চেকআউট ──────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── ২. JDK সেটআপ ─────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── ৩. Gradle ক্যাশ (বিল্ড দ্রুত করে) ──────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── ৪. Gradle Wrapper সেটআপ ──────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ── ৫. ZIP আনজিপ (যদি প্রজেক্ট ZIP হিসেবে আপলোড থাকে) ──────
      - name: Unzip project (if ZIP found)
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No zip file found – using repo root as project"
          fi

      # ── ৬. settings.gradle.kts খুঁজে PROJECT_DIR সেট ────────────
      - name: Find project directory
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" \
            -not -path "*/.git/*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ── ৭. .env ফাইল তৈরি (Gemini API Key দিয়ে) ─────────────────
      - name: Create .env file with Gemini API Key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$KEY" ]; then
            echo "⚠️  No GEMINI_API_KEY secret found – using dummy value for test build"
            KEY="dummy_test_key_for_build_only"
          fi
          echo "GEMINI_API_KEY=$KEY" > .env
          echo ".env file created ✅"

      # ── ৮. Gradle Wrapper জেনারেট ────────────────────────────────
      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ls -la

      # ── ৯. Debug Keystore তৈরি ───────────────────────────────────
      - name: Generate debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "debug.keystore created ✅"

      # ── ১০. Debug APK বিল্ড ──────────────────────────────────────
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      # ── ১১. APK-এর সাইজ ও পাথ দেখাও ────────────────────────────
      - name: Show APK info
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -n "$APK" ]; then
            echo "APK found: $APK"
            ls -lh "$APK"
          else
            echo "❌ APK not found!"
            exit 1
          fi

      # ── ১২. APK আর্টিফ্যাক্ট হিসেবে আপলোড ──────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dharma-ai-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 7
          if-no-files-found: error
