name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unzip and setup project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_project
          fi
          
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.git/*" | head -n 1)
          echo "gradlew found at: $GRADLEW_PATH"
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found!"
            find . -type f -name "*.gradle" | head -20
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          chmod +x "$GRADLEW_PATH"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ env.PROJECT_DIR }}/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akshor-posha-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
