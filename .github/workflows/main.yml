name: Build Debug APK - Dharma AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Firebase AI + KSP + Compose = heavy build; 25 was too short

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # gradle/actions/setup-gradle already handles caching better than actions/cache alone.
      # Using both caused cache conflicts — removed the manual cache step.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false   # allow writing to cache on first run

      - name: Unzip project (if ZIP found)
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No zip file found – using repo root as project"
          fi

      - name: Find project directory
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" \
            -not -path "*/.git/*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # The google-services plugin is applied but google-services.json is missing.
      # The project already sets missingGoogleServicesStrategy = WARN in build.gradle.kts
      # and googleServices.missing.passthrough=true in gradle.properties, so the build
      # won't fail — but we still create a minimal stub to silence the warning entirely
      # and avoid any plugin overhead during the config phase.
      - name: Create stub google-services.json
        working-directory: ${{ env.PROJECT_DIR }}/app
        run: |
          # Use real secret if available, otherwise write a minimal valid stub.
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
            echo "google-services.json from secret ✅"
          else
            cat > google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id":     "stub-project",
              "storage_bucket": "stub-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.example" }
                },
                "api_key":      [{ "current_key": "stub" }],
                "services":     {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "Stub google-services.json created ✅"
          fi

      - name: Create .env file with API keys
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          GEMINI_KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$GEMINI_KEY" ]; then
            echo "⚠️  No GEMINI_API_KEY secret – using dummy value for build"
            GEMINI_KEY="dummy_test_key_for_build_only"
          fi
          # Write all keys the Secrets plugin expects (matches .env.example)
          cat > .env <<EOF
          GEMINI_API_KEY=$GEMINI_KEY
          GOOGLE_SEARCH_API_KEY=${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX=${{ secrets.GOOGLE_SEARCH_CX }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          EOF
          echo ".env file created ✅"

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Generate debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "debug.keystore created ✅"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        # No separate step timeout — the job-level 45 min covers it.
        # configuration-cache is already ON in gradle.properties; --no-daemon is correct for CI.
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000

      - name: Show APK info
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -n "$APK" ]; then
            echo "APK found: $APK"
            ls -lh "$APK"
          else
            echo "❌ APK not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dharma-ai-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 7
          if-no-files-found: error
          
